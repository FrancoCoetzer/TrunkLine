# Tests and vets every push and pull request: on Linux (with the Windows
# cross-build) and on Windows itself, each on x64 and ARM64.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev subversion

      - run: make vet
      - run: make test
      - run: make app windows

  # The UI tests (tests/ui): Playwright drives the dev build's page against a
  # throwaway repository; the app's window goes to xvfb. The report, with a
  # screenshot of every view in both themes, is kept with the run.
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev subversion xvfb

      - name: Install Playwright's Chromium
        run: |
          cd tests/ui
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - run: make ui-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-report
          path: tests/ui/playwright-report
          retention-days: 14

  # The tests on Windows itself: drive letters, svn.exe (which expands
  # wildcards in its arguments and writes paths in the ANSI code page), CRLF
  # output, file:///C:/ URLs.
  test-windows:
    strategy:
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # SlikSVN is an x64 build: on ARM64 Windows it runs emulated, as it
      # would for anyone who installs it there.
      - name: Install svn (SlikSVN, with svnadmin)
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor 3072
            Invoke-Expression ((New-Object Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            "$env:ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:Path += ";$env:ProgramData\chocolatey\bin"
          }
          choco install sliksvn --no-progress -y
          "C:\Program Files\SlikSvn\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - run: svn --version --quiet
      - run: go vet ./...
      # A failing test is also reported as an annotation (on the run's page,
      # readable without access to the logs).
      - name: go test ./...
        run: |
          go test ./... 2>&1 | Tee-Object -FilePath test-output.txt
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path test-output.txt -Pattern '--- FAIL|svn: [EW]\d{6}|_test\.go:\d+:' |
              Select-Object -First 10 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }
      - name: Build
        run: |
          python packaging/windows/make_syso.py 0.0.0 (go env GOARCH)
          go build -tags desktop,production -ldflags "-H windowsgui" -o trunkline.exe .
