# Tests and vets every push and pull request: on Linux (with the Windows
# cross-build), and on Windows itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev subversion

      - run: make vet
      - run: make test
      - run: make app windows

  # The tests on Windows itself: drive letters, svn.exe (which expands
  # wildcards in its arguments), CRLF output, file:///C:/ URLs.
  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install svn (SlikSVN, with svnadmin)
        run: |
          choco install sliksvn --no-progress -y
          "C:\Program Files\SlikSvn\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - run: svn --version --quiet
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: |
          python packaging/windows/make_syso.py 0.0.0 amd64
          go build -tags desktop,production -ldflags "-H windowsgui" -o trunkline.exe .
